services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sitetrack
      POSTGRES_PASSWORD: sitetrack
      POSTGRES_DB: sitetrack
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitetrack -d sitetrack"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgres://sitetrack:sitetrack@db:5432/sitetrack
      PORT: 3000
      # Dev defaults so `docker compose up` works as-is; override in real deployments.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-600}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
